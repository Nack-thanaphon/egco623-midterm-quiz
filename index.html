<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EGCO623 Data Mining — แบบทดสอบปรนัย 100 ข้อ สุ่มทำครั้งละ 50 ข้อ พร้อมเฉลย" />
    <title>EGCO623 Data Mining — 50 Question Check</title>
    <link rel="stylesheet" href="style.css?v=4" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <strong>EGCO623</strong>
        <span>DATA MINING · MIDTERM CHECK</span>
      </div>
      <small>11 OCT 2026 · 09:00–12:00</small>
    </header>

    <main>
      <section id="start" class="screen">
        <h1>เช็กความเข้าใจ</h1>

        <div class="groups" aria-label="สัดส่วนข้อสอบ">
          <div><b>15</b><span>Data Mining &<br />Exploring Data</span><em>15%</em></div>
          <div><b>35</b><span>Preprocessing<br />& Models</span><em>35%</em></div>
          <div><b>25</b><span>Association<br />Rules</span><em>25%</em></div>
          <div><b>25</b><span>Clustering</span><em>25%</em></div>
        </div>

        <button id="startBtn" class="primary">เริ่มทำ 50 ข้อ</button>
      </section>

      <section id="quiz" class="screen hidden" aria-live="polite">
        <div class="quiz-top">
          <button id="quitBtn" class="text-button">← เริ่มใหม่</button>
          <span id="progressText">หน้า 1 / 5 · ข้อ 1–10</span>
          <b id="liveScore">ถูก 0</b>
        </div>
        <div class="progress"><i id="progressBar"></i></div>

        <div id="questionList" class="question-list"></div>
        <div class="page-actions">
          <span id="answerStatus">ตอบแล้ว 0 / 10</span>
          <button id="checkPageBtn" class="primary" disabled>ตรวจ 10 ข้อนี้</button>
          <button id="nextPageBtn" class="primary hidden">หน้าถัดไป →</button>
        </div>
      </section>

      <section id="result" class="screen hidden">
        <p class="overline">RESULT</p>
        <h1 id="scoreText">0 / 50</h1>
        <p id="scoreMessage" class="intro"></p>
        <div id="breakdown" class="breakdown"></div>
        <button id="restartBtn" class="primary">สุ่มทำอีก 50 ข้อ</button>
        <section class="review-section">
          <h2>ข้อที่ตอบผิด</h2>
          <div id="wrongReview" class="wrong-review"></div>
        </section>
      </section>
    </main>

    <script src="app.js?v=4"></script>
  </body>
</html>
